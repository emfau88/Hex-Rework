<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#071b24">
<title>One Crown · Prototype</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 18.5h18l1.2-10.2-5.4 4.1L12 4.5 7.2 12.4 1.8 8.3z" fill="currentColor"/><rect x="3" y="19.6" width="18" height="2" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5 6.1 20.6l1.2-6.5L2.5 9.5l6.6-.9z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 4.8v14.4a1 1 0 001.5.86l12-7.2a1 1 0 000-1.72l-12-7.2a1 1 0 00-1.5.86z" fill="currentColor"/></symbol>
    <symbol id="i-tower" viewBox="0 0 24 24"><path d="M6 21V10.5L4.8 9V4h2.6v2h2.2V4h4.8v2h2.2V4h2.6v5L18 10.5V21z" fill="currentColor"/></symbol>
    <symbol id="i-farm" viewBox="0 0 24 24"><path d="M2.5 11.5L12 4l9.5 7.5-1.3 1.6L19 12.2V20H5v-7.8l-1.2.9z" fill="currentColor"/><rect x="10" y="14" width="4" height="6" fill="#071b24"/></symbol>
    <symbol id="i-supply" viewBox="0 0 24 24"><path d="M4 8.5h11.5l-3-3M20 15.5H8.5l3 3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5v5h3.6l5 4V5.5l-5 4z" fill="currentColor"/><path d="M16 9a4.5 4.5 0 010 6M18.6 6.4a8 8 0 010 11.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5v5h3.6l5 4V5.5l-5 4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M7 10V8a5 5 0 0110 0v2h1.5v10h-13V10zm2.2 0h5.6V8a2.8 2.8 0 00-5.6 0z" fill="currentColor"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-turn" viewBox="0 0 24 24"><path d="M19.2 12a7.2 7.2 0 11-2.4-5.4" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/><path d="M17.4 2.6v4.6h-4.6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 6L4 11l5 5M4.5 11H14a5.5 5.5 0 010 11h-3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div id="app" data-mode="menu">
  <canvas id="world"></canvas>
  <canvas id="overlay"></canvas>

  <header id="top" class="bar">
    <button id="btn-pause" class="icon-btn" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
    <div id="share">
      <div id="share-bar"></div>
      <div id="share-legend"></div>
      <div id="goal"><span id="goal-text"></span><span id="goal-bar"><i></i></span></div>
    </div>
    <button id="btn-view" class="icon-btn" hidden><svg><use href="#i-full"/></svg></button>
    <button id="btn-turn" class="icon-btn"><svg><use href="#i-turn"/></svg></button>
    <div id="clock">0:00</div>
  </header>

  <!-- Side panels on wide screens: the own kingdom on the left, rivals and events on the right. -->
  <aside id="panel-own" class="panel" hidden>
    <h3 data-t="panelOwn"></h3>
    <dl>
      <div><dt data-t="panelFields"></dt><dd id="own-fields">0</dd></div>
      <div><dt data-t="panelTroops"></dt><dd id="own-troops">0</dd></div>
      <div><dt data-t="panelGrowth"></dt><dd id="own-growth">0</dd></div>
      <div><dt data-t="tower"></dt><dd id="own-towers">0</dd></div>
      <div><dt data-t="farm"></dt><dd id="own-farms">0</dd></div>
    </dl>
  </aside>
  <aside id="panel-rivals" class="panel" hidden>
    <h3 data-t="panelRivals"></h3>
    <div id="rivals"></div>
    <h3 data-t="panelEvents"></h3>
    <ol id="events"></ol>
  </aside>

  <!-- Figure showcase (link ?schau): monsters and troops are set by hand, the time can be stopped
       and slowed down, and the values of the field last tapped stand below. -->
  <aside id="lab" hidden>
    <div id="lab-tools" class="lab-tools"></div>
    <div class="lab-row">
      <div class="lab-amount">
        <span class="lab-label" data-t="panelTroops"></span>
        <button data-step="-1" aria-label="-">−</button><b id="lab-amount">20</b><button data-step="1" aria-label="+">+</button>
      </div>
      <div id="lab-time" class="lab-time"></div>
    </div>
    <div id="lab-info" class="lab-info"></div>
  </aside>

  <!-- Planning pause: the match stands still, the board stays in view and takes orders. -->
  <div id="pausebar" hidden>
    <div class="txt"><b data-t="pause"></b><span data-t="pauseHint"></span></div>
    <button id="btn-continue" class="primary" data-t="resume"></button>
    <button id="btn-options" data-t="options"></button>
  </div>

  <!-- Turn mode: whose move, the commands left, undo, and end move (while the rivals move: skip). -->
  <div id="turnbar" hidden>
    <div class="txt"><b id="turn-title"></b><span id="turn-sub"></span></div>
    <span id="turn-pips"></span>
    <button id="btn-undo" aria-label="Undo"><svg><use href="#i-undo"/></svg></button>
    <button id="btn-endturn" class="primary"></button>
  </div>

  <div id="banner" aria-live="polite"></div>
  <div id="hint"></div>

  <footer id="bottom" class="bar">
    <button id="btn-send" class="send">
      <span class="small" data-t="send"></span>
      <span id="send-value" class="big">50 %</span>
    </button>
    <button id="btn-tower" class="build" disabled>
      <svg><use href="#i-tower"/></svg>
      <span class="small" data-t="tower"></span>
      <b id="cost-tower">10</b>
      <span id="why-tower" class="why"></span>
      <kbd class="key">T</kbd>
    </button>
    <button id="btn-farm" class="build" disabled>
      <svg><use href="#i-farm"/></svg>
      <span class="small" data-t="farm"></span>
      <b id="cost-farm">8</b>
      <span id="why-farm" class="why"></span>
      <kbd class="key" data-t="farmKey">H</kbd>
    </button>
    <button id="btn-supply" class="build toggle">
      <svg><use href="#i-supply"/></svg>
      <span class="small" data-t="supply"></span>
      <b id="supply-state">AN</b>
    </button>
  </footer>

  <section id="menu" class="sheet">
    <div class="card">
      <div class="brand">
        <svg class="crown"><use href="#i-crown"/></svg>
        <h1>ONE CROWN</h1>
        <p class="tag" data-t="tagline"></p>
        <p class="testflag"><b data-t="testFlag"></b> · <a href="https://emfau88.github.io/Hex-Rework/" data-t="testBack"></a></p>
      </div>
      <!-- One column on a phone; two side by side on wide screens, so the menu fits without scrolling. -->
      <div class="cols">
        <div class="col">
          <h2 data-t="pickColor"></h2>
          <div id="colors" class="colors"></div>
          <h2 data-t="campaign"></h2>
          <div id="missions" class="missions"></div>
        </div>
        <div class="col">
          <h2 data-t="skirmish"></h2>
          <div id="skirmish" class="missions"></div>
          <p id="untuned-note" class="note" data-t="untunedNote"></p>
          <h2 data-t="difficulty"></h2>
          <div id="difficulty" class="seg"></div>
          <h2 data-t="tempo"></h2>
          <div class="seg speed"></div>
        </div>
      </div>
      <div class="foot">
        <button id="btn-sound" class="icon-btn" aria-label="Sound"><svg><use href="#i-sound"/></svg></button>
        <button id="btn-lang" class="icon-btn text">DE</button>
        <button id="btn-full" class="icon-btn" aria-label="Fullscreen"><svg><use href="#i-full"/></svg></button>
      </div>
      <p class="note" data-t="protoNote"></p>
    </div>
  </section>

  <section id="brief" class="sheet" hidden>
    <div class="card">
      <p id="brief-no" class="eyebrow"></p>
      <h1 id="brief-name" class="sheet-title"></h1>
      <p id="brief-text" class="sub"></p>
      <div class="lesson"><b data-t="newRule"></b><span id="brief-lesson"></span></div>
      <div class="lesson goal"><b data-t="goal"></b><span id="brief-goal"></span></div>
      <div id="brief-stars" class="stars"></div>
      <div class="actions">
        <button id="btn-start" class="primary" data-t="start"></button>
        <button id="btn-back" data-t="back"></button>
      </div>
    </div>
  </section>

  <section id="pause" class="sheet" hidden>
    <div class="card">
      <h1 id="pause-title" class="sheet-title" data-t="pause"></h1>
      <ul id="how-turns" class="how" hidden>
        <li data-t="turnHow1"></li>
        <li data-t="turnHow2"></li>
        <li data-t="turnHow3"></li>
        <li data-t="turnHow4"></li>
        <li data-t="turnHow5"></li>
        <li data-t="turnHow6"></li>
        <li data-t="turnHow8"></li>
        <li data-t="turnHow9"></li>
        <li data-t="turnHow10"></li>
        <li data-t="turnHow7" class="pc"></li>
      </ul>
      <ul id="how-time" class="how">
        <li data-t="how1"></li>
        <li data-t="how2"></li>
        <li data-t="how3"></li>
        <li data-t="how4"></li>
        <li data-t="how5"></li>
        <li data-t="how6"></li>
        <li data-t="how7"></li>
        <li data-t="how8" class="pc"></li>
      </ul>
      <h2 id="tempo-head" data-t="tempo"></h2>
      <div class="seg speed"></div>
      <div class="actions">
        <button id="btn-resume" class="primary" data-t="resume"></button>
        <button id="btn-restart" data-t="restart"></button>
        <button id="btn-quit" data-t="menu"></button>
      </div>
    </div>
  </section>

  <section id="result" class="sheet" hidden>
    <div class="card center">
      <h1 id="result-title" class="sheet-title big"></h1>
      <p id="result-sub" class="sub"></p>
      <div id="result-stars" class="stars"></div>
      <div id="result-stats" class="stats"></div>
      <div class="actions">
        <button id="btn-next" class="primary" data-t="next"></button>
        <button id="btn-retry" data-t="retry"></button>
        <button id="btn-menu" data-t="menu"></button>
      </div>
      <button id="btn-log" class="textbtn" hidden></button>
    </div>
  </section>

  <div id="fatal" hidden></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
